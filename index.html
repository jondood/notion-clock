<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Clock</title>
<style>
html,body{margin:0;height:100%;background:transparent;color-scheme:light dark;font-family:"Quicksand","Nunito","Segoe UI",system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:flex-end;gap:3vw}
.flap{position:relative;width:26vw;height:30vw;perspective:60vw;filter:drop-shadow(0 1.2vw 2vw rgba(214,120,150,.28))}
.half{position:absolute;left:0;right:0;height:50%;box-sizing:border-box;overflow:hidden;background:#fde9ef;color:#c2456f;font-weight:700;font-size:19vw;text-align:center;--lift:1.4vw}
.half span{display:block;height:30vw;line-height:30vw;transform:translateY(calc(0vw - var(--lift)))}
.top{top:0;border-radius:2.5vw 2.5vw 0 0;border-bottom:max(1.5px,.5vw) solid #efbccd}
.bot{bottom:0;border-radius:0 0 2.5vw 2.5vw}
.bot span{transform:translateY(calc(-15vw - var(--lift)))}
.flip{transform-origin:bottom;z-index:2;animation:f .45s ease-in forwards}
.flipb{transform-origin:top;z-index:2;transform:rotateX(90deg);animation:g .45s .45s ease-out forwards}
@keyframes f{to{transform:rotateX(-90deg)}}@keyframes g{to{transform:rotateX(0)}}
.ap{background:#fde9ef;color:#c2456f;font-weight:700;font-size:5vw;padding:1vw 1.8vw;border-radius:1.5vw;box-shadow:0 1vw 2vw rgba(214,120,150,.28)}
.ap:empty{display:none}
</style></head><body>
<div class="row"><div class="flap" id="h"></div><div class="flap" id="m"></div><div class="ap" id="ap"></div></div>
<script>
const P=new URLSearchParams(location.search),H24=P.get("24h")==="1";
function set(el,v,old){el.innerHTML="";
 const mk=(c,t)=>{const d=document.createElement("div");d.className="half "+c;const s=document.createElement("span");s.textContent=t;d.appendChild(s);el.appendChild(d);return d};
 mk("top",v);mk("bot",old??v);
 if(old!=null&&old!==v){mk("top flip",old);const b=mk("bot flipb",v);b.addEventListener("animationend",()=>{set(el,v)})}}
let ph,pm;
function tick(){const d=new Date();let h=d.getHours();const ap=h<12?"AM":"PM";if(!H24)h=h%12||12;
 const hs=String(h).padStart(2,"0"),ms=String(d.getMinutes()).padStart(2,"0");
 if(hs!==ph){set(document.getElementById("h"),hs,ph);ph=hs}
 if(ms!==pm){set(document.getElementById("m"),ms,pm);pm=ms}
 document.getElementById("ap").textContent=H24?"":ap}
tick();setInterval(tick,1000);
</script></body></html>
